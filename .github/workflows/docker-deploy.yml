name: Build Docker Container & Artifact

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export Docker Image to Tar.gz for Artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: mango-moooo:latest
          outputs: type=docker,dest=/tmp/mango-moooo-image.tar

      - name: Compress Image Archive
        run: gzip /tmp/mango-moooo-image.tar

      - name: Upload Docker Image Artifact
        id: artifact-upload
        uses: actions/upload-artifact@v4
        with:
          name: mango-moooo-docker-image
          path: /tmp/mango-moooo-image.tar.gz
          retention-days: 14

      - name: Tampilkan URL Deployment di Summary
        run: |
          echo "### 🚀 Docker Container & Artifact Siap Deploy!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**1. Container Registry URL (GHCR):**" >> $GITHUB_STEP_SUMMARY
          echo "\`ghcr.io/eqhypratama/website-bisnis:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**2. Download Artifact URL (.tar.gz):**" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.artifact-upload.outputs.artifact-url }}" >> $GITHUB_STEP_SUMMARY
